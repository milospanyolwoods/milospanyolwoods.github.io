<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta name="google-site-verification" content="NLJTk6p-kPaPwS_cMNpBLWxmoMXJJ9d4jTytAGjkgJ4" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="{{ '/favicon_io/favicon.ico' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon_io/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon_io/favicon-16x16.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/favicon_io/apple-touch-icon.png' | relative_url }}">
    <title>{{ page.title | default: site.title | escape }}</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px 16px;
        background: #999999;
        color: #1f2328;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .markdown-body {
        max-width: 1012px;
        margin: 0 auto;
        padding: 0 32px;
        overflow-wrap: break-word;
      }
      .markdown-body h1, .markdown-body h2, .markdown-body h3 {
        margin-top: 24px;
        margin-bottom: 16px;
        font-weight: 600;
        line-height: 1.25;
      }
      .markdown-body h1 {
        font-size: 2em;
      }
      .markdown-body p, .markdown-body ul { margin-top: 0; margin-bottom: 16px; }
      .markdown-body ul { padding-left: 2em; }
      .markdown-body a {
        color: inherit;
        text-decoration-line: underline;
        text-decoration-style: dotted;
        text-underline-offset: 0.18em;
      }
      .markdown-body img { max-width: 100%; height: auto; }
      .home-link {
        display: inline-block;
        margin-bottom: 8px;
        font-size: 1.75rem;
        line-height: 1;
      }
      .home-link:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
      .homepage-intro {
        display: flex;
        align-items: flex-start;
        gap: 24px;
      }
      .homepage-intro img { width: 35%; }
      .homepage-intro ul {
        margin: 0;
        padding-left: 24px;
      }
      @media (max-width: 600px) {
        body { padding: 24px 16px; }
        .markdown-body { padding: 0; }
        .homepage-intro { flex-direction: column; }
        .homepage-intro img { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="markdown-body">
      {% unless page.url == "/" %}
      <a class="home-link" href="{{ '/' | relative_url }}" aria-label="Return to homepage" title="Return to homepage">←</a>
      {% endunless %}
      {{ content }}
    </main>
  </body>
</html>
